# ProjectCenter — vhost nginx (hebergement statique QVL, meme serveur que
# npm.qvl-project.com / canopui.qvl-project.com). SPA React (Vite) servie a la
# racine. Deep-links geres par rewrite serveur -> index.html (BrowserRouter).
#
# Deploiement des artefacts : C:\QVL\deploy\projectcenter (voir tools/deploy-local.sh),
# aligne sur le pattern deploy-vitrine de CanopUI.

server {
    listen 80;
    server_name projectcenter.qvl-project.com;

    root /mnt/c/QVL/deploy/projectcenter;
    index index.html;

    # Rewrite deep-links -> index.html : indispensable pour react-router v7
    # (createBrowserRouter). Sans ca, un acces direct a /studio/... renvoie 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets fingerprintes (Vite) : cache long, immutables.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html jamais mis en cache (sinon deep-link sur ancienne version).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---------------------------------------------------------------------------
    # CSP — BASELINE DevOps, A VALIDER/DURCIR par @qvl-securite (Gate 2 US6) AVANT PROD.
    # Posee en header HTTP car l'hote (nginx) le permet ; le frontend n'a donc PAS
    # besoin de meta tag CSP dans index.html.
    # Besoins connus couverts :
    #  - connect-src raw.githubusercontent.com : fetch runtime des docs (VITE_DOCS_BASE_URL).
    #  - style-src 'unsafe-inline' : MUI/emotion injectent des styles au runtime.
    #  - img-src https: data: : logos projets + images markdown distantes.
    # 'unsafe-inline' style est un point d'attention explicite pour la securite.
    # ---------------------------------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://raw.githubusercontent.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; script-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
