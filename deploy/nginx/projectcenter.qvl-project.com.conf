# ============================================================================
# SUPERSEDED — CE VHOST NE SERT PLUS LA PRODUCTION. NE PAS L'AUDITER COMME LA
# CONFIGURATION ACTIVE.
#
# Le sous-domaine projectcenter.qvl-project.com ne resout plus en DNS. Le site
# est desormais servi a l'apex qvl-project.com par serve-vitrine.mjs (port 8300)
# expose via cloudflared. Toute modification de la configuration reellement
# active se fait dans serve-vitrine.mjs, pas ici.
#
# Fichier conserve a titre de reference historique uniquement (tracabilite des
# arbitrages Gate secu 2). Voir QVL-Documentation/QVL-ProjectCenter/README.md.
# ============================================================================

# ProjectCenter — vhost nginx (hebergement statique QVL, meme serveur que
# npm.qvl-project.com / canopui.qvl-project.com). SPA React (Vite) servie a la
# racine. Deep-links geres par rewrite serveur -> index.html (BrowserRouter).
#
# Deploiement des artefacts : C:\QVL\deploy\projectcenter (voir tools/deploy-local.sh),
# aligne sur le pattern deploy-vitrine de CanopUI.

server {
    listen 80;
    server_name projectcenter.qvl-project.com;

    root /mnt/c/QVL/deploy/projectcenter;
    index index.html;

    # Ne pas divulguer la version nginx (finding Minor SEC-318-01, Gate secu 2).
    server_tokens off;

    # Rewrite deep-links -> index.html : indispensable pour react-router v7
    # (createBrowserRouter). Sans ca, un acces direct a /studio/... renvoie 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets fingerprintes (Vite) : cache long, immutables.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html jamais mis en cache (sinon deep-link sur ancienne version).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---------------------------------------------------------------------------
    # CSP — valeurs FINALES tranchees par @qvl-securite (Gate 2 US6 : PASS).
    # Meme politique que le meta injecte au build (vite.config.ts) ; seul ecart
    # voulu : frame-ancestors 'none', porte uniquement par ce header (ignore en meta).
    # Whitelist explicite (pas de https: generique) :
    #  - connect-src gitlab.com : fetch runtime des docs (API GitLab v4, VITE_DOCS_API_PROJECT_URL).
    #  - img-src gitlab.com + img.shields.io : images/badges des docs markdown.
    #  - style-src 'unsafe-inline' : MUI/emotion injectent des styles au runtime.
    # Note Gate 2 : Google Fonts volontairement NON whiteliste. Cible atteinte
    # depuis canopui 3.x : plus aucun @import distant, Chivo et Titan One sont
    # declares en @font-face inlines en data: woff2 dans la feuille -> couverts
    # par font-src 'self' data:.
    # Note canopui 3.x : le fond de canopee est servi en same-origin sur
    # /canopui/video -> media-src retombe sur default-src 'self', rien a whitelister.
    # ---------------------------------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://gitlab.com; img-src 'self' data: https://gitlab.com https://img.shields.io; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
